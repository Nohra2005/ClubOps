name: Container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Container and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: bundled
      CLUBOPS_MODEL_MODE: replay
      CLUBOPS_COMPOSE_TEST_PROJECT: clubops-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser test tools
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start the complete app from Compose
        run: docker compose --project-name clubops-ci up --build --detach --wait --wait-timeout 90
      - name: Browser sign-in, deep links, JSON errors and asset routing
        working-directory: web
        run: npm run test:e2e:compose -- --reporter=line --output test-results/compose
      - name: SQLite state and existing cookie survive container replacement
        run: node web/scripts/check-compose-persistence.mjs
      - name: Production refuses development cookie settings
        run: |
          docker build --target production --build-arg VITE_GOOGLE_CLIENT_ID=synthetic.apps.googleusercontent.com --tag clubops:production-check .
          mkdir -p output
          if docker run --rm -e CLUBOPS_SESSION_SECRET=synthetic-check-only -e CLUBOPS_GOOGLE_CLIENT_ID=synthetic.apps.googleusercontent.com -e CLUBOPS_DEV_LOGIN=1 clubops:production-check > output/production-guard.txt 2>&1; then
            echo 'Production unexpectedly accepted dev login.'
            exit 1
          fi
          grep -F 'Production requires dev login disabled and secure cookies enabled.' output/production-guard.txt
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-failure-evidence
          path: |
            web/test-results/
            output/production-guard.txt
          retention-days: 7
      - name: Stop the isolated CI containers (keep no long-running service)
        if: always()
        run: docker compose --project-name clubops-ci down
