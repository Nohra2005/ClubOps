name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci
      - name: Lint, format, unit tests, strict types and production build
        run: npm run check

  browser:
    name: Web browser and API contracts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: bundled
      CLUBOPS_MODEL_MODE: replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked Python and frontend dependencies
        run: |
          uv sync --locked --project ..
          npm ci
      - name: Build context excludes secrets, runtime data and host dependencies
        run: node scripts/check-build-context.mjs
      - name: Install the matching Chromium build and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Demo workflows and accessibility (desktop and phone)
        run: npm run test:e2e -- --reporter=line --output test-results/demo
      - name: HTTP contract and failure cases (no external calls)
        run: npm run test:e2e:http -- --reporter=line --output test-results/http
      - name: Real API, SQLite and approval flow (scripted model)
        run: npm run test:e2e:live -- --reporter=line --output test-results/live
      - name: Preserve synthetic browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-failure-traces
          path: web/test-results/
          retention-days: 7
