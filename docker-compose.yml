name: clubops

services:
  app:
    image: clubops:local
    build:
      context: .
      target: local
      args:
        VITE_DEV_LOGIN: "1"
        VITE_GOOGLE_CLIENT_ID: ""
    init: true
    ports:
      - "127.0.0.1:${CLUBOPS_LOCAL_PORT:-8080}:10000"
    env_file:
      - path: .env
        required: false
    environment:
      CLUBOPS_DATA_DIR: /var/data/clubops
      CLUBOPS_DEV_LOGIN: "1"
      CLUBOPS_COOKIE_SECURE: "0"
      CLUBOPS_SESSION_SECRET: ""
      CLUBOPS_MODEL_MODE: ${CLUBOPS_MODEL_MODE:-replay}
      CLUBOPS_RECORDINGS_DIR: /var/data/private/recordings
      CLUBOPS_TRACE_PATH: /var/data/private/traces/clubops.jsonl
    volumes:
      - clubops-data:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 60s

volumes:
  clubops-data:
