[project]
name = "clubops"
version = "0.1.0"
description = "An AI agent that keeps an AUB student club's know-how across cabinet handovers and prepares its event paperwork."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "email-validator>=2.1",
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=3.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clubops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "PL", "RUF"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "RUF001", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR0915"]
"scripts/*" = ["S101", "T201"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clubops"]

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*"]  # optional tracking extra; CI type-checks without it installed
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/clubops"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
